name: Trae Daily Checkin

on:
  schedule:
    # 主轮：北京时间 09:03（推送窗口内最早；跑完约 1 分钟 → 09:05 左右收到）
    - cron: "3 1 * * *"
    # 兜底轮：北京时间 18:13。主轮失败时补签；幂等，不重复领积分；
    # 只在有失败时才推送，所以正常情况一天仍只有 1 条消息。
    - cron: "13 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checkin
        env:
          TRAE_SESSION: ${{ secrets.TRAE_SESSION }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
          TRAE_SESSION_2: ${{ secrets.TRAE_SESSION_2 }}
          TRAE_DEVICE_ID_2: ${{ secrets.TRAE_DEVICE_ID_2 }}
          TRAE_SESSION_3: ${{ secrets.TRAE_SESSION_3 }}
          TRAE_DEVICE_ID_3: ${{ secrets.TRAE_DEVICE_ID_3 }}
          TRAE_SESSION_4: ${{ secrets.TRAE_SESSION_4 }}
          TRAE_DEVICE_ID_4: ${{ secrets.TRAE_DEVICE_ID_4 }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # 主轮（08:00）与手动触发：每轮都推送；兜底轮（18:00）：仅失败时推送
          TRAE_NOTIFY: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '3 1 * * *') && 'always' || 'fail' }}
        run: python checkin.py
